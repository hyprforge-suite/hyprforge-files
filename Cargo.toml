[package]
name = "hyprforge-files"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A file manager for Hyprland: tabs, a sidebar, list and grid views, the freedesktop trash, copy and paste with other applications, and zip/tar/7z archives browsed and edited in place."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-files"
readme = "README.md"
keywords = ["hyprland", "wayland", "file-manager", "iced", "linux"]
categories = ["os::linux-apis", "gui"]

[[bin]]
name = "hyprforge-files"
path = "src/main.rs"

[dependencies]
# The browser view itself lives in hyprforge-files-core, because the
# portal's open/save dialog has to render the same one. This crate is
# the window around it: navigation chrome, the keyboard grammar, and
# the file operations a dialog deliberately does not have.
hyprforge-files-core = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-fileops = { git = "https://github.com/adamrpostjr/hyprforge" }
# What a file is, and which applications can open it — see
# `launch.rs` for why the launching itself is still the desktop's.
hyprforge-mime = { git = "https://github.com/adamrpostjr/hyprforge" }
# Which file in the configured icon theme a type's icon is — the listing's
# icons. hyprforge-mime says which name a type's icon has; this finds it.
hyprforge-icons = { git = "https://github.com/adamrpostjr/hyprforge" }
# The preview pane asks poppler and ffmpeg for a PDF's page and a video's
# frame, and nothing may wait on another program without a bound.
hyprforge-process = { git = "https://github.com/adamrpostjr/hyprforge" }
# The freedesktop thumbnail cache — thumbnails made once per version of a
# file, shared with every other program that makes them.
hyprforge-thumbnails = { git = "https://github.com/adamrpostjr/hyprforge" }
# A video's thumbnail is its first real frame, found the same way the
# photo viewer finds it — the two share one thumbnail cache, and two
# programs picking different frames would each find the other's there.
hyprforge-video = { git = "https://github.com/adamrpostjr/hyprforge" }
# Zip, tar and 7z. The browsing of them is `hyprforge-files-core`'s
# (through `FsBackend`); what this crate adds is the long, cancellable
# work — extracting, compressing and rewriting — which needs the backend
# directly rather than through a listing.
hyprforge-archive = { git = "https://github.com/adamrpostjr/hyprforge" }
# Grid thumbnails and the preview pane: decoded within a budget, with
# the EXIF orientation applied — the same decode the image viewer uses,
# so a photograph is the same way up in both.
hyprforge-image = { git = "https://github.com/adamrpostjr/hyprforge" }
# The Wayland clipboard, so copied files reach other applications and
# theirs reach this one. The library only — this app never needs the
# clipboard history daemon to be installed or running.
hyprforge-clipboard = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-ui = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-look = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-appearance = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-paths = { git = "https://github.com/adamrpostjr/hyprforge" }
# `tokio` on top of the workspace base, the same addition
# `hyprforge-settings` makes and for the same reason: it selects iced's
# tokio executor, so the futures a `Task` runs are polled inside a tokio
# runtime. Without it `Task::perform` runs on a `futures` thread pool
# with no ambient runtime, and the free function
# `tokio::task::spawn_blocking()` panics with "there is no reactor
# running" — the same class of failure the root Cargo.toml's note about
# zbus and the `notif/` workspace describes. Declaring it here rather
# than relying on Cargo unifying features from `hyprforge-settings`:
# that unification only happens when something builds both, so
# `cargo build -p hyprforge-files` alone would not get it.
# `canvas` alongside `tokio`. The active tab's outline runs up one side,
# across the top and down the other, and stops — iced's `Border` has a
# single width for all four sides, so the open bottom edge that makes a
# tab a tab rather than a floating pill has to be a drawn path.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "tokio",
    "canvas",
    # Thumbnails and the preview pane draw decoded pixels.
    "image",
    # The icon theme's file-type icons are SVG.
    "svg",
] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Not a dev-dependency: a file opened out of an archive is unpacked to a
# scratch directory first — see `App::open_from_archive`.
tempfile = "3"

[dev-dependencies]
# Building an encrypted zip by hand, to prove the window opens a password
# prompt rather than reporting a failure. This crate's own writer will
# not produce one — encrypting an archive is not a thing it offers.
zip = "8"
# The `mock` feature turns on `hyprforge_files_core::backend::MockBackend`,
# which this crate's tests drive the whole window against — the window
# owns an `Arc<dyn FsBackend>`, so its update loop (stale generations,
# tab routing, folder counts) can be exercised without a real disk.
hyprforge-files-core = { git = "https://github.com/adamrpostjr/hyprforge", features = ["mock"] }
# `MockFilesystem`, so undo's tests can trash into a temporary directory
# rather than the real Trash of whoever runs them.
hyprforge-fileops = { git = "https://github.com/adamrpostjr/hyprforge", features = ["mock"] }
